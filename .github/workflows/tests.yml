name: tests

on:
    pull_request:
    push:
        branches:
            - main
            - master
            - codex/**

jobs:
    tests:
        runs-on: ubuntu-latest

        name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

        strategy:
            fail-fast: false
            matrix:
                # 8.3 is the floor: every laravel/ai release we support requires it.
                php:
                    - "8.3"
                    - "8.4"
                # testbench 10 is Laravel 12, testbench 11 is Laravel 13. Both are
                # supported, so both are tested — a package that claims a range
                # without exercising its ends is guessing.
                testbench:
                    - "^10.0"
                    - "^11.0"
                # Overlaps `testbench`, so these only attach a readable label to
                # the matching combinations rather than adding jobs of their own.
                include:
                    - testbench: "^10.0"
                      laravel: "12"
                    - testbench: "^11.0"
                      laravel: "13"

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

            - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

            - run: composer validate --strict
            - run: composer test
